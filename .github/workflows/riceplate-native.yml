name: Native RicePlate prototype

on:
  push:
    paths:
      - '.github/workflows/riceplate-native.yml'
      - 'components/riceplate-wayland/**'
      - 'scripts/smoke_riceplate_native.sh'
      - 'scripts/compare_wayland_captures.py'
      - 'tests/test_de_visual_qa.py'
      - 'tests/fixtures/riceplate-desktop-v5-overflow.json'
      - 'macrice/de/capture.py'
      - 'macrice/de/render.py'
      - 'macrice/cli.py'
  pull_request:
    paths:
      - '.github/workflows/riceplate-native.yml'
      - 'components/riceplate-wayland/**'
      - 'scripts/smoke_riceplate_native.sh'
      - 'scripts/compare_wayland_captures.py'
      - 'tests/test_de_visual_qa.py'
      - 'tests/fixtures/riceplate-desktop-v5-overflow.json'
      - 'macrice/de/capture.py'
      - 'macrice/de/render.py'
      - 'macrice/cli.py'

permissions:
  contents: read

jobs:
  native-layer-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test native RicePlate
        run: |
          cargo test --manifest-path components/riceplate-wayland/Cargo.toml
          cargo build --release --manifest-path components/riceplate-wayland/Cargo.toml
          sh -n scripts/smoke_riceplate_native.sh
      - name: Prepare native preview artifact with build provenance
        run: |
          set -eu
          mkdir -p dist/riceplate-native-preview
          install -m 0755 components/riceplate-wayland/target/release/riceplate-native \
            dist/riceplate-native-preview/riceplate-native
          cp components/riceplate-wayland/Cargo.lock \
            dist/riceplate-native-preview/Cargo.lock
          dist/riceplate-native-preview/riceplate-native --version
          printf 'Git commit: %s\nToolchain: %s\nBuild host: Ubuntu 24.04 x86_64\nStatus: experimental native panel, not a full desktop release\n' \
            "$GITHUB_SHA" "$(rustc --version)" > dist/riceplate-native-preview/BUILDINFO.txt
          (cd dist/riceplate-native-preview && sha256sum riceplate-native Cargo.lock > SHA256SUMS)
          (cd dist/riceplate-native-preview && sha256sum -c SHA256SUMS)
      - name: Install headless labwc
        run: |
          sudo apt-get update
          sudo apt-get install -y labwc grim wlr-randr swaybg python3-pil dbus-user-session dbus-x11
      - name: Boot native Wayland layer surface
        run: timeout -k 5s 70s sh scripts/smoke_riceplate_native.sh
      - name: Render validated recipe in isolated Creator compositor
        run: |
          set -eu
          private_recipe=$(mktemp -d -t riceplate-headless-recipe-XXXXXXXX)
          trap 'rm -r -- "$private_recipe"' EXIT
          chmod 0700 "$private_recipe"
          cp tests/fixtures/riceplate-desktop-v5.json "$private_recipe/recipe.json"
          chmod 0600 "$private_recipe/recipe.json"
          export PATH="$PWD/components/riceplate-wayland/target/release:$PATH"
          dbus-run-session -- /usr/bin/python3 launcher.py de render \
            --recipe "$private_recipe/recipe.json" \
            --output "$PWD/dist/riceplate-native-preview/isolated-v5.png" \
            --width 1024 --height 768 --json \
            > dist/riceplate-native-preview/isolated-v5.json
      - name: Validate and record real multi-resolution captures
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          import struct
          from PIL import Image
          from scripts.compare_wayland_captures import compare

          directory = Path('dist/riceplate-native-preview')
          private_recipe = directory / 'desktop-v5-recipe.json'
          private_recipe.write_bytes(Path('tests/fixtures/riceplate-desktop-v5.json').read_bytes())
          private_recipe.chmod(0o600)
          manifest = {
              'manifest_version': 1,
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'environment': {'compositor': 'labwc', 'backend': 'headless',
                              'renderer': 'pixman', 'native_surface': 'riceplate'},
              'recipe_sha256': hashlib.sha256(private_recipe.read_bytes()).hexdigest(),
              'captures': [],
          }
          expected = {
              'desktop-v5-1024x768': (1024, 768, 1),
              'desktop-v5-1366x768': (1366, 768, 1),
              'desktop-v5-1920x1080': (1920, 1080, 1),
              'desktop-v5-scale-125': (1366, 768, 1.25),
              'overflow-v5': (1024, 768, 1),
              'creator-v1': (1024, 768, 1),
              'isolated-v5': (1024, 768, 1),
          }
          captures = {}
          for label in ('shell-v4', 'desktop-v5', *expected):
              screenshot = Path(f'dist/riceplate-native-preview/{label}.png')
              data = screenshot.read_bytes()
              assert data[:8] == bytes.fromhex('89504e470d0a1a0a'), f'{label}: not a PNG capture'
              width, height = struct.unpack('>II', data[16:24])
              assert width >= 640 and height >= 480, (label, width, height)
              assert len(data) >= 512, f'{label}: missing screenshot pixels'
              if label in expected:
                  target_width, target_height, scale = expected[label]
                  assert (width, height) == (target_width, target_height), (label, width, height)
                  record = {
                      'file': screenshot.name,
                      'width': width, 'height': height, 'scale': scale,
                      'sha256': hashlib.sha256(data).hexdigest(),
                  }
                  if label in ('overflow-v5', 'creator-v1'):
                      # A requested x=4090 icon is intentionally invisible
                      # without native output-aware reflow. With 1024x768
                      # logical bounds it must be clamped to (920, 672).
                      with Image.open(screenshot) as image:
                          rgb = image.convert('RGB').getpixel((950, 690))
                      assert all(abs(actual - expected_color) <= 2 for actual, expected_color in
                                 zip(rgb, (65, 121, 170))), f'icon was not reflowed: {rgb}'
                      record['reflow_pixel'] = {'x': 950, 'y': 690, 'rgb': rgb}
                      if label == 'creator-v1':
                          receipt = json.loads((directory / 'creator-v1.json').read_text())
                          assert receipt['ok'] and receipt['creator_contract_version'] == 1
                          assert receipt['capture']['source'] == 'current-wayland-compositor'
                          assert receipt['capture']['sha256'] == record['sha256']
                          assert receipt['capture']['width'] == width
                          assert receipt['capture']['height'] == height
                  elif label == 'isolated-v5':
                      receipt = json.loads((directory / 'isolated-v5.json').read_text())
                      assert receipt['ok'] and receipt['creator_contract_version'] == 1
                      assert receipt['render']['source'] == 'isolated-headless-labwc-native-riceplate'
                      assert receipt['render']['recipe']['id'] == 'mockup-desktop'
                      assert receipt['render']['output']['sha256'] == record['sha256']
                      assert receipt['render']['geometry'] == {
                          'width': 1024, 'height': 768, 'scale': 1.0}
                      with Image.open(screenshot) as image:
                          rgb = image.convert('RGB').getpixel((64, 112))
                      assert all(abs(actual - expected_color) <= 2 for actual, expected_color in
                                 zip(rgb, (65, 121, 170))), f'native icon missing: {rgb}'
                      record['native_icon_pixel'] = {'x': 64, 'y': 112, 'rgb': rgb}
                  else:
                      # Self-comparison is solely a geometry preflight, not
                      # an assessment of visual fidelity or interaction.
                      report = compare(screenshot, screenshot, recipe_token=str(private_recipe.resolve()))
                      assert not report['layout_issues'], (label, report['layout_issues'])
                      record['regions'] = [
                          {key: region[key] for key in ('id', 'expected_rect', 'visible_fraction')}
                          for region in report['regions']]
                  manifest['captures'].append(record)
              print(f'Captured real native labwc {label}: {width}x{height}, {len(data)} bytes')
              captures[label] = data
          assert captures['shell-v4'] != captures['desktop-v5'], 'Icons missing from v5 framebuffer'
          (directory / 'capture-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - name: Archive smoke-tested native RicePlate preview binary
        uses: actions/upload-artifact@v4
        with:
          name: riceplate-native-preview-${{ github.sha }}
          path: dist/riceplate-native-preview/
          if-no-files-found: error
          retention-days: 14
