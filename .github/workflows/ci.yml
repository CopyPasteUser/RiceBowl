name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK introspection for Linux tests
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0
      - name: Validate and test the suite
        run: |
          /usr/bin/python3 -m compileall -q macrice launcher.py
          /usr/bin/python3 -m unittest discover -s tests -v
          (cd components/macmenu && /usr/bin/python3 -m unittest discover -s tests -v)
          (cd components/macbar && /usr/bin/python3 -m unittest discover -s tests -v)
          (cd components/control-center && PATH=/usr/bin:/bin bash run-tests.sh)
